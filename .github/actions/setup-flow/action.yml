name: Setup Flow CLI
description: Install and cache Flow CLI and Cadence dependencies

runs:
  using: composite
  steps:
    - name: Get latest Flow CLI version
      id: flow-version
      shell: bash
      run: |
        VERSION=$(curl -fsSL --retry 3 --retry-delay 2 https://api.github.com/repos/onflow/flow-cli/releases/latest | jq -r .tag_name)
        if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
          echo "Failed to fetch Flow CLI version" >&2
          exit 1
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - uses: actions/cache@v5
      with:
        path: |
          ~/.local/bin/flow
          ./imports
          .flow-fork-cache
        key: ${{ runner.os }}-flow-${{ steps.flow-version.outputs.version }}-${{ hashFiles('flow.json') }}
        restore-keys: |
          ${{ runner.os }}-flow-${{ steps.flow-version.outputs.version }}-

    - name: Install Flow CLI
      shell: bash
      run: |
        if ! test -f "$HOME/.local/bin/flow"; then
          sh -c "$(curl -fsSL --retry 3 --retry-delay 2 https://raw.githubusercontent.com/onflow/flow-cli/master/install.sh)"
          echo "Installed Flow CLI $("$HOME/.local/bin/flow" version)"
        else
          echo "Restored Flow CLI from cache"
        fi
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies
      shell: bash
      run: flow deps install --skip-alias --skip-deployments
